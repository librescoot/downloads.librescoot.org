name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [releases-changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'repository_dispatch' && 'dispatch' || 'deploy' }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Pages can acknowledge repository_dispatch deployments without serving
      # their artifact. A workflow_dispatch of the same source deploys it.
      - name: Start deploy through workflow dispatch
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      latest_sha256: ${{ steps.manifest.outputs.latest }}
      stable_sha256: ${{ steps.manifest.outputs.stable }}
      testing_sha256: ${{ steps.manifest.outputs.testing }}
      nightly_sha256: ${{ steps.manifest.outputs.nightly }}
      v2_latest_sha256: ${{ steps.manifest.outputs.v2_latest }}
      v2_stable_sha256: ${{ steps.manifest.outputs.v2_stable }}
      v2_testing_sha256: ${{ steps.manifest.outputs.v2_testing }}
      v2_nightly_sha256: ${{ steps.manifest.outputs.v2_nightly }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Validate index transformations before fetching live release data.
      - name: Test release index generation
        run: |
          python3 .github/test-filter-firmware-releases.py
          python3 .github/test-live-release-index.py
          python3 .github/test-transition-firmware-index.py
          node .github/test-firmware-index.js
          .github/test-tiles-index.sh
          python3 .github/test-map-index.py
          .github/test-installer-index.sh
          python3 .github/test-installer-beta-index.py
          python3 .github/test-installer-beta-validation.py

      - name: Fetch release data
        run: .github/generate-release-index.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_BRIDGE_TAG: ${{ vars.OTA_STABLE_BRIDGE_TAG }}
          TESTING_BRIDGE_TAG: ${{ vars.OTA_TESTING_BRIDGE_TAG }}
          NIGHTLY_BRIDGE_TAG: ${{ vars.OTA_NIGHTLY_BRIDGE_TAG }}

      - name: Build site
        run: npm run build

      - name: Test generated beta downloads
        run: |
          python3 .github/test-installer-beta.py
          node .github/test-installer-beta-layout.js

      - name: Record expected release manifest
        id: manifest
        run: |
          for channel in latest stable testing nightly; do
            echo "$channel=$(sha256sum "_site/releases/$channel.json" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            if [ -f "_site/releases/v2/$channel.json" ]; then
              echo "v2_$channel=$(sha256sum "_site/releases/v2/$channel.json" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live release discovery
        run: python3 .github/verify-live-release-index.py
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_LATEST_SHA256: ${{ needs.build.outputs.latest_sha256 }}
          EXPECTED_STABLE_SHA256: ${{ needs.build.outputs.stable_sha256 }}
          EXPECTED_TESTING_SHA256: ${{ needs.build.outputs.testing_sha256 }}
          EXPECTED_NIGHTLY_SHA256: ${{ needs.build.outputs.nightly_sha256 }}
          EXPECTED_V2_LATEST_SHA256: ${{ needs.build.outputs.v2_latest_sha256 }}
          EXPECTED_V2_STABLE_SHA256: ${{ needs.build.outputs.v2_stable_sha256 }}
          EXPECTED_V2_TESTING_SHA256: ${{ needs.build.outputs.v2_testing_sha256 }}
          EXPECTED_V2_NIGHTLY_SHA256: ${{ needs.build.outputs.v2_nightly_sha256 }}
